<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0b0d10">
  <title>GZCLP UI preview</title>
  <link rel="stylesheet" href="../../styles/base.css">

  <link rel="stylesheet" href="./preview.css">

    <a href="#/settings" class="tab"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="tab-label">Settings</span></a>
